<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lausorgo Match Tracker</title>
<style>
  :root {
    --green: #1B5E20;
    --leaf: #4C993F;
    --navy: #10285A;
    --amber: #C47814;
    --bg: #F7FAF7;
    --ink: #222;
    --gray: #6B7280;
    --border: #E5E7EB;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 18px 14px 60px; }
  header.top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 18px; flex-wrap: wrap; gap: 8px;
  }
  header.top h1 { font-size: 19px; margin: 0; color: var(--green); }
  header.top p { font-size: 12px; color: var(--gray); margin: 2px 0 0; }
  #saveState { font-size: 12px; color: var(--gray); white-space: nowrap; }
  #saveState.saved { color: var(--green); }
  #saveState.error { color: #dc2626; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
  .tab-btn {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 12px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); background: white; color: #555; cursor: pointer;
    white-space: nowrap;
  }
  .tab-btn.active { background: var(--green); color: white; border-color: var(--green); }

  .card {
    background: white; border-radius: 16px; border: 1px solid #f0f0f0;
    padding: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); margin-bottom: 16px;
  }
  .card h3 { font-size: 14px; font-weight: 600; color: #374151; margin: 0 0 12px; display:flex; align-items:center; gap:6px;}

  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  @media (min-width: 600px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
  .stat-card {
    background: white; border-radius: 14px; border: 1px solid #f0f0f0;
    padding: 12px; display: flex; gap: 10px; align-items: flex-start;
  }
  .stat-icon { width: 34px; height: 34px; border-radius: 10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
  .stat-label { font-size: 11px; color: var(--gray); }
  .stat-value { font-size: 18px; font-weight: 600; color: #333; }

  .badge { display:inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 500; }

  .field { margin-bottom: 10px; }
  .field label { display:block; font-size: 11px; font-weight: 500; color: var(--gray); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 14px; background: white; color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--leaf); border-color: transparent; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .grid2, .grid3 { grid-template-columns: 1fr 1fr; } }

  .btn {
    display: inline-flex; align-items: center; justify-content:center; gap: 6px;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; color: white;
  }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-green { background: var(--green); }
  .btn-leaf { background: var(--leaf); }
  .btn-navy { background: var(--navy); }

  .list-item {
    border: 1px solid #f0f0f0; border-radius: 12px; padding: 11px 12px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;
  }
  .list-item .meta { font-size: 12px; color: var(--gray); margin-top: 4px; display:flex; flex-wrap:wrap; gap: 4px 12px; }
  .del-btn { background:none; border:none; color:#d1d5db; cursor:pointer; font-size:16px; padding:2px; flex-shrink:0; }
  .del-btn:hover { color: #ef4444; }

  .empty { text-align:center; color:#9ca3af; padding: 34px 10px; font-size: 13px; }

  table { width:100%; border-collapse: collapse; font-size: 13px; }
  th { text-align:left; font-size: 11px; color:#9ca3af; font-weight:500; padding: 6px 4px; border-bottom:1px solid #f0f0f0; }
  td { padding: 8px 4px; border-bottom:1px solid #f7f7f7; white-space:nowrap; }
  .tbl-wrap { overflow-x:auto; }

  .commission-box { background:#E8F4E7; border-radius:10px; padding:10px; text-align:center; }
  .commission-box .lbl { font-size:11px; color:var(--gray); }
  .commission-box .val { font-size:18px; font-weight:700; color: var(--green); }

  .warn { font-size:12px; color:#b45309; background:#fffbeb; border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .bar-label { width:90px; font-size:13px; color:#555; flex-shrink:0; }
  .bar-track { flex:1; height:10px; background:#f0f0f0; border-radius:6px; overflow:hidden; }
  .bar-fill { height:100%; background: var(--leaf); border-radius:6px; }
  .bar-value { width:90px; text-align:right; font-size:13px; font-weight:500; flex-shrink:0; }

  @media print {
    header.top, .tabs, #saveState, .no-print, div[style*="background:#E7EAF3"] { display: none !important; }
    body { background: white; }
    .wrap { padding: 0; max-width: 100%; }
    .card { box-shadow: none; border: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Lausorgo Match Tracker</h1>
      <p>Match farmers to buyers and track your commission</p>
    </div>
    <div id="saveState"></div>
  </header>

  <div style="background:#E7EAF3;color:#10285A;font-size:12px;padding:8px 12px;border-radius:10px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
    <span id="backendModeText">\u{1F465} Shared team data — connecting…</span>
    <span style="display:flex;align-items:center;gap:6px;">
      Logging as:
      <input id="actorName" placeholder="Your name" style="padding:4px 8px;border-radius:6px;border:1px solid #c7d0e6;font-size:12px;width:120px;"/>
    </span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>

<script>
const STORAGE_KEY = "lausorgo-match-tracker-data";
const PRODUCE_OPTIONS = ["Maize","Sorghum","Groundnut","Cowpea","Tomatoes","Pepper","Onions","Other"];
const UNIT_OPTIONS = ["Bag (100kg)","Bag (50kg)","Kg","Basket","Crate","Ton"];

let data = { supply: [], demand: [], transactions: [], activityLog: [] };
let currentTab = "dashboard";
let showSupplyForm = false;
let showDemandForm = false;
let currentActor = "";

function logActivity(action, details) {
  if (!data.activityLog) data.activityLog = [];
  data.activityLog.push({
    id: uid(),
    time: new Date().toISOString(),
    actor: currentActor.trim() || "Unnamed team member",
    action, details
  });
  if (data.activityLog.length > 500) data.activityLog = data.activityLog.slice(-500); // cap growth
}

const RESTRICTED_PIN = "2026"; // change this to your own PIN — anyone editing the file can see it, so treat it as a soft deterrent, not real security
const RESTRICTED_TABS = ["report", "export"];
let unlockedTabs = new Set();
const uid = () => Math.random().toString(36).slice(2, 10);
const naira = (n) => "\u20a6" + Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
const esc = (s) => (s || "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SHARED = true; // shared across everyone who opens this tool
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzbP5UV6_ooYsOfXshIh49XVmOB6tjwOPACWMdBCXf-JUBw3JYsXCrrWW3_FIeixR6s/exec";
let backendMode = "unknown"; // "sheets" | "claude" | "none"

function mergeDefaults(parsed) {
  return { supply: [], demand: [], transactions: [], activityLog: [], ...parsed };
}

async function fetchFromSheets() {
  const res = await fetch(BACKEND_URL, { method: "GET" });
  if (!res.ok) throw new Error("Sheets backend returned " + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : {};
}

async function saveToSheets(payload) {
  const res = await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify(payload) });
  if (!res.ok) throw new Error("Sheets backend returned " + res.status);
  return true;
}

function updateBackendBanner() {
  const el = document.getElementById("backendModeText");
  if (!el) return;
  if (backendMode === "sheets") {
    el.textContent = "\u2705 Synced via shared Google Sheet — works from any copy of this file, on any device.";
  } else if (backendMode === "claude") {
    el.textContent = "\u26A0\uFE0F Synced via Claude only — everyone must open the same Claude link for this to sync. (Google Sheets backend unreachable.)";
  } else {
    el.textContent = "\u274C Not syncing right now — check your internet connection.";
  }
}

async function loadData() {
  // Try the independent Google Sheets backend first — works regardless of how this file was opened.
  try {
    const parsed = await fetchFromSheets();
    data = mergeDefaults(parsed);
    backendMode = "sheets";
  } catch (e) {
    // Fall back to Claude's built-in storage (only works when opened as a Claude artifact).
    try {
      const res = await window.storage.get(STORAGE_KEY, SHARED);
      if (res && res.value) {
        data = mergeDefaults(JSON.parse(res.value));
      }
      backendMode = "claude";
    } catch (e2) {
      backendMode = "none";
    }
  }
  updateBackendBanner();
  render();
}

async function refreshFromServer() {
  try {
    if (backendMode === "sheets") {
      const parsed = await fetchFromSheets();
      data = mergeDefaults(parsed);
      render();
    } else if (backendMode === "claude") {
      const res = await window.storage.get(STORAGE_KEY, SHARED);
      if (res && res.value) {
        data = mergeDefaults(JSON.parse(res.value));
        render();
      }
    }
  } catch (e) { /* ignore transient errors on background refresh */ }
}

async function persist() {
  const el = document.getElementById("saveState");
  el.textContent = "Saving…"; el.className = "";
  try {
    if (backendMode === "sheets") {
      await saveToSheets(data);
      el.textContent = "\u2713 Saved to shared Google Sheet";
      el.className = "saved";
    } else {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(data), SHARED);
      el.textContent = result ? "\u2713 Saved (Claude storage \u2014 open via the same link to sync)" : "Save failed";
      el.className = result ? "saved" : "error";
      backendMode = result ? "claude" : backendMode;
    }
  } catch (e) {
    // If the Sheets backend suddenly fails mid-session, try Claude storage as a safety net.
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(data), SHARED);
      el.textContent = "\u26A0 Saved locally to Claude only \u2014 check internet connection";
      el.className = "error";
    } catch (e2) {
      el.textContent = "Save failed — check connection";
      el.className = "error";
    }
  }
  setTimeout(() => { el.textContent = ""; }, 2600);
}

// Poll for teammates' changes every 15s, but only when not actively filling a form
setInterval(() => {
  const activeTag = document.activeElement ? document.activeElement.tagName : "";
  const isEditing = activeTag === "INPUT" || activeTag === "SELECT" || activeTag === "TEXTAREA";
  if (!showSupplyForm && !showDemandForm && currentTab !== "match" && !isEditing) {
    refreshFromServer();
  }
}, 15000);

function selectOptions(list, selected) {
  return list.map(o => `<option value="${esc(o)}" ${o===selected?"selected":""}>${esc(o)}</option>`).join("");
}

const TABS = [
  { id: "dashboard", label: "Dashboard", icon: "\u{1F4CA}" },
  { id: "supply", label: "Farmers", icon: "\u{1F331}" },
  { id: "demand", label: "Buyers", icon: "\u{1F6D2}" },
  { id: "match", label: "Match & Log Deal", icon: "\u{1F91D}" },
  { id: "transactions", label: "Deals", icon: "\u{1F4C8}" },
  { id: "payments", label: "Payments Due", icon: "\u{1F4B3}" },
  { id: "activity", label: "Activity Log", icon: "\u{1F553}" },
  { id: "report", label: "Impact Report", icon: "\u{1F4CB}" },
  { id: "export", label: "Export Data", icon: "\u{1F4E5}" },
];

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t => `
    <button class="tab-btn ${currentTab===t.id?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}${RESTRICTED_TABS.includes(t.id) && !unlockedTabs.has(t.id) ? ' \uD83D\uDD12' : ''}</button>
  `).join("");
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { currentTab = btn.dataset.tab; render(); };
  });
}

function render() {
  renderTabs();
  const actorInput = document.getElementById("actorName");
  if (actorInput) {
    if (document.activeElement !== actorInput) actorInput.value = currentActor;
    actorInput.oninput = () => { currentActor = actorInput.value; };
  }
  const content = document.getElementById("content");
  if (currentTab === "dashboard") content.innerHTML = renderDashboard();
  else if (currentTab === "supply") content.innerHTML = renderSupplyTab();
  else if (currentTab === "demand") content.innerHTML = renderDemandTab();
  else if (currentTab === "match") content.innerHTML = renderMatchTab();
  else if (currentTab === "transactions") content.innerHTML = renderTransactionsTab();
  else if (currentTab === "payments") content.innerHTML = renderPaymentsTab();
  else if (currentTab === "activity") content.innerHTML = renderActivityTab();
  else if (currentTab === "report") content.innerHTML = RESTRICTED_TABS.includes("report") && !unlockedTabs.has("report") ? renderPinGate("report", "Impact Report") : renderReportTab();
  else if (currentTab === "export") content.innerHTML = RESTRICTED_TABS.includes("export") && !unlockedTabs.has("export") ? renderPinGate("export", "Export Data") : renderExportTab();
  attachHandlers();
}

// ---------- DASHBOARD ----------
function renderDashboard() {
  const totalCommission = data.transactions.reduce((s,t) => s + (t.commissionEarned||0), 0);
  const dealCount = data.transactions.length;
  const openSupply = data.supply.filter(s => s.status !== "closed").length;
  const openDemand = data.demand.filter(d => d.status !== "closed").length;

  const byProduce = {};
  data.transactions.forEach(t => { byProduce[t.produce] = (byProduce[t.produce]||0) + (t.commissionEarned||0); });
  const sortedProduce = Object.entries(byProduce).sort((a,b)=>b[1]-a[1]);
  const max = sortedProduce.length ? sortedProduce[0][1] : 1;

  const recent = [...data.transactions].reverse().slice(0,5);

  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-icon" style="background:${hex(('#1B5E20'),0.1)}">\u{1F4B0}</div><div><div class="stat-label">Commission earned</div><div class="stat-value">${naira(totalCommission)}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:${hex('#10285A',0.1)}">\u{1F91D}</div><div><div class="stat-label">Deals closed</div><div class="stat-value">${dealCount}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:${hex('#4C993F',0.1)}">\u{1F331}</div><div><div class="stat-label">Open farmer offers</div><div class="stat-value">${openSupply}</div></div></div>
      <div class="stat-card"><div class="stat-icon" style="background:${hex('#C47814',0.1)}">\u{1F6D2}</div><div><div class="stat-label">Open buyer requests</div><div class="stat-value">${openDemand}</div></div></div>
    </div>

    <div class="card">
      <h3>Commission by produce</h3>
      ${sortedProduce.length === 0 ? `<p class="empty" style="padding:10px 0;">Close your first deal to see this breakdown.</p>` :
        sortedProduce.map(([produce, amt]) => `
          <div class="bar-row">
            <div class="bar-label">${esc(produce)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(amt/max*100)}%"></div></div>
            <div class="bar-value">${naira(amt)}</div>
          </div>
        `).join("")
      }
    </div>

    <div class="card">
      <h3>Recent activity</h3>
      ${recent.length === 0 ? `<div class="empty">No deals logged yet — closed deals will show up here.</div>` :
        recent.map(t => `
          <div class="list-item">
            <div><b>${esc(t.produce)}</b> <span style="color:#9ca3af">— ${esc(t.farmer)} \u2192 ${esc(t.buyer)}</span></div>
            <span class="badge" style="color:#1B5E20;background:#E8F4E7;">+${naira(t.commissionEarned)}</span>
          </div>
        `).join("")
      }
    </div>
  `;
}
function hex(color, alpha) {
  // returns rgba-ish via simple hex+alpha hack using color-mix fallback
  return color + Math.round(alpha*255).toString(16).padStart(2,'0');
}

// ---------- SUPPLY TAB ----------
function renderSupplyTab() {
  const items = [...data.supply].reverse();
  return `
    ${!showSupplyForm ? `<button class="btn btn-leaf" id="openSupplyForm">+ New supply offer</button>` : renderSupplyForm()}
    <div class="card" style="margin-top:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
        <h3 style="margin:0;">\u{1F331} Farmer supply offers (${data.supply.length})</h3>
        <button class="btn" style="background:#374151;padding:7px 12px;font-size:12px;" id="exportFarmersOnlyBtn">\u{1F512} \u{1F4E5} Download all farmer data (CSV)</button>
      </div>
      ${items.length === 0 ? `<div class="empty">No supply offers logged yet.</div>` :
        items.map(s => `
          <div class="list-item">
            <div>
              <div><b>${esc(s.farmer)}</b> <span class="badge" style="background:#E8F4E7;color:#4C993F;">${esc(s.produce)}</span> ${s.status==='closed'?'<span class="badge" style="background:#F3F4F6;color:#9ca3af;">closed</span>':''}</div>
              <div class="meta">
                <span>\u{1F4E6} ${esc(s.quantity)} ${esc(s.unit)}</span>
                ${s.pricePerUnit ? `<span>${naira(s.pricePerUnit)}/unit</span>` : ''}
                ${s.hectares ? `<span>\u{1F33E} ${esc(s.hectares)} ha</span>` : ''}
                ${s.phone ? `<span>\u{1F4DE} ${esc(s.phone)}</span>` : ''}
                ${s.location ? `<span>\u{1F4CD} ${esc(s.location)}</span>` : ''}
                ${(s.community || s.lga || s.state) ? `<span>\u{1F3D8}\uFE0F ${[s.community, s.lga, s.state].filter(Boolean).map(esc).join(", ")}</span>` : ''}
                ${mapLink(s) ? `<a href="${mapLink(s)}" target="_blank" rel="noopener" style="color:#4C993F;text-decoration:none;">\u{1F5FA}\uFE0F View on map</a>` : ''}
              </div>
            </div>
            <button class="del-btn" data-del-supply="${s.id}">\u2715</button>
          </div>
        `).join("")
      }
    </div>
  `;
}
function renderSupplyForm() {
  return `
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;">New farmer supply offer</h3>
      <button class="del-btn" id="closeSupplyForm" style="font-size:18px;">\u2715</button>
    </div>
    <div class="grid2">
      <div class="field"><label>Farmer name</label><input id="sf_farmer" placeholder="e.g. Musa Ibrahim"/></div>
      <div class="field"><label>Phone</label><input id="sf_phone" placeholder="08…"/></div>
      <div class="field"><label>Produce</label><select id="sf_produce">${selectOptions(PRODUCE_OPTIONS)}</select></div>
      <div class="grid2">
        <div class="field"><label>Quantity</label><input id="sf_quantity" type="number" placeholder="0"/></div>
        <div class="field"><label>Unit</label><select id="sf_unit">${selectOptions(UNIT_OPTIONS)}</select></div>
      </div>
      <div class="field"><label>Asking price / unit (\u20a6)</label><input id="sf_price" type="number" placeholder="0"/></div>
      <div class="field"><label>Hectares of land owned</label><input id="sf_hectares" type="number" step="0.1" placeholder="e.g. 2.5"/></div>
      <div class="field"><label>Location</label>
        <div style="display:flex;gap:6px;">
          <input id="sf_location" placeholder="e.g. Lakwene" style="flex:1;"/>
          <button type="button" class="btn btn-leaf" id="sf_useLoc" style="padding:9px 12px;font-size:12px;white-space:nowrap;">\u{1F4CD} Use my location</button>
        </div>
        <div id="sf_locStatus" style="font-size:11px;color:#9ca3af;margin-top:3px;"></div>
        <input type="hidden" id="sf_lat"/><input type="hidden" id="sf_lng"/>
      </div>
    </div>
    <div class="grid3">
      <div class="field"><label>State</label><input id="sf_state" value="Gombe"/></div>
      <div class="field"><label>LGA</label><input id="sf_lga" value="Billiri"/></div>
      <div class="field"><label>Community</label><input id="sf_community" placeholder="e.g. Lakwene"/></div>
    </div>
    <button class="btn btn-green block" id="submitSupply">+ Add supply offer</button>
  </div>`;
}

// ---------- DEMAND TAB ----------
function renderDemandTab() {
  const items = [...data.demand].reverse();
  return `
    ${!showDemandForm ? `<button class="btn btn-navy" id="openDemandForm">+ New buyer request</button>` : renderDemandForm()}
    <div class="card" style="margin-top:14px;">
      <h3>\u{1F6D2} Buyer requests (${data.demand.length})</h3>
      ${items.length === 0 ? `<div class="empty">No buyer requests logged yet.</div>` :
        items.map(d => `
          <div class="list-item">
            <div>
              <div><b>${esc(d.buyer)}</b> <span class="badge" style="background:#E7EAF3;color:#10285A;">${esc(d.produce)}</span> ${d.status==='closed'?'<span class="badge" style="background:#F3F4F6;color:#9ca3af;">closed</span>':''}</div>
              <div class="meta">
                <span>\u{1F4E6} ${esc(d.quantity)} ${esc(d.unit)}</span>
                ${d.priceOfferedPerUnit ? `<span>${naira(d.priceOfferedPerUnit)}/unit</span>` : ''}
                ${d.ownsShop ? `<span>\u{1F3EA} Shop: ${esc(d.ownsShop)}</span>` : ''}

function attachLocationCapture(btnId, statusId, latId, lngId, locInputId) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.onclick = () => {
    const status = document.getElementById(statusId);
    if (!navigator.geolocation) {
      status.textContent = "Location access not supported here — just type the place name above.";
      return;
    }
    status.textContent = "Getting location…";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById(latId).value = pos.coords.latitude;
        document.getElementById(lngId).value = pos.coords.longitude;
        status.textContent = "\u2713 Location captured (" + pos.coords.latitude.toFixed(4) + ", " + pos.coords.longitude.toFixed(4) + ")";
      },
      (err) => {
        status.textContent = "Couldn't get location (" + (err.message || "permission denied") + ") — just type the place name above instead.";
      },
      { timeout: 8000 }
    );
  };
}

function mapLink(item) {
  if (item.lat && item.lng) {
    return `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
  }
  if (item.location) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.location)}`;
  }
  return null;
}

function toCSV(rows, columns) {
  const escCsv = (v) => {
    const s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const header = columns.map(c => escCsv(c.label)).join(",");
  const body = rows.map(r => columns.map(c => escCsv(typeof c.value === "function" ? c.value(r) : r[c.value])).join(",")).join("\n");
  return header + "\n" + body;
}
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function attachHandlers() {
  // Supply tab
  const openSupplyForm = document.getElementById("openSupplyForm");
  if (openSupplyForm) openSupplyForm.onclick = () => { showSupplyForm = true; render(); };
  const closeSupplyForm = document.getElementById("closeSupplyForm");
  if (closeSupplyForm) closeSupplyForm.onclick = () => { showSupplyForm = false; render(); };
  attachLocationCapture("sf_useLoc", "sf_locStatus", "sf_lat", "sf_lng", "sf_location");
  const submitSupply = document.getElementById("submitSupply");
  if (submitSupply) submitSupply.onclick = () => {
    const farmer = document.getElementById("sf_farmer").value.trim();
    const quantity = document.getElementById("sf_quantity").value;
    if (!farmer || !quantity) return;
    data.supply.push({
      id: uid(), farmer, phone: document.getElementById("sf_phone").value.trim(),
      produce: document.getElementById("sf_produce").value, quantity,
      unit: document.getElementById("sf_unit").value,
      pricePerUnit: document.getElementById("sf_price").value,
      hectares: document.getElementById("sf_hectares").value,
      location: document.getElementById("sf_location").value.trim(),
      state: document.getElementById("sf_state").value.trim(),
      lga: document.getElementById("sf_lga").value.trim(),
      community: document.getElementById("sf_community").value.trim(),
      lat: document.getElementById("sf_lat").value || null,
      lng: document.getElementById("sf_lng").value || null,
      date: new Date().toISOString(), status: "open"
    });
    logActivity("Added farmer offer", `${farmer} — ${document.getElementById("sf_produce").value}, ${quantity} ${document.getElementById("sf_unit").value}`);
    showSupplyForm = false; persist(); render();
  };
  document.querySelectorAll("[data-del-supply]").forEach(btn => {
    btn.onclick = () => {
      const s = data.supply.find(x => x.id === btn.dataset.delSupply);
      data.supply = data.supply.filter(s => s.id !== btn.dataset.delSupply);
      if (s) logActivity("Deleted farmer offer", `${s.farmer} — ${s.produce}`);
      persist(); render();
    };
  });

  // Demand tab
  const openDemandForm = document.getElementById("openDemandForm");
  if (openDemandForm) openDemandForm.onclick = () => { showDemandForm = true; render(); };
  const closeDemandForm = document.getElementById("closeDemandForm");
  if (closeDemandForm) closeDemandForm.onclick = () => { showDemandForm = false; render(); };
  attachLocationCapture("df_useLoc", "df_locStatus", "df_lat", "df_lng", "df_location");
  const submitDemand = document.getElementById("submitDemand");
  if (submitDemand) submitDemand.onclick = () => {
    const buyer = document.getElementById("df_buyer").value.trim();
    const quantity = document.getElementById("df_quantity").value;
    if (!buyer || !quantity) return;
    data.demand.push({
      id: uid(), buyer, phone: document.getElementById("df_phone").value.trim(),
      produce: document.getElementById("df_produce").value, quantity,
      unit: document.getElementById("df_unit").value,
      priceOfferedPerUnit: document.getElementById("df_price").value,
      ownsShop: document.getElementById("df_ownsShop").value,
      location: document.getElementById("df_location").value.trim(),
      state: document.getElementById("df_state").value.trim(),
      lga: document.getElementById("df_lga").value.trim(),
      community: document.getElementById("df_community").value.trim(),
      lat: document.getElementById("df_lat").value || null,
      lng: document.getElementById("df_lng").value || null,
      date: new Date().toISOString(), status: "open"
    });
    logActivity("Added buyer request", `${buyer} — ${document.getElementById("df_produce").value}, ${quantity} ${document.getElementById("df_unit").value}`);
    showDemandForm = false; persist(); render();
  };
  document.querySelectorAll("[data-del-demand]").forEach(btn => {
    btn.onclick = () => {
      const d = data.demand.find(x => x.id === btn.dataset.delDemand);
      data.demand = data.demand.filter(d => d.id !== btn.dataset.delDemand);
      if (d) logActivity("Deleted buyer request", `${d.buyer} — ${d.produce}`);
      persist(); render();
    };
  });

  // Match tab
  const m_supply = document.getElementById("m_supply");
  if (m_supply) m_supply.onchange = () => {
    matchState.supplyId = m_supply.value;
    const s = data.supply.find(x => x.id === m_supply.value);
    if (s) { matchState.buyPrice = s.pricePerUnit || ""; matchState.quantity = s.quantity || ""; }
    render();
  };
  const m_demand = document.getElementById("m_demand");
  if (m_demand) m_demand.onchange = () => {
    matchState.demandId = m_demand.value;
    const d = data.demand.find(x => x.id === m_demand.value);
    if (d) { matchState.sellPrice = d.priceOfferedPerUnit || ""; }
    render();
  };
  ["m_quantity","m_buyPrice","m_sellPrice","m_commValue","m_notes","m_payeeName","m_payeeBank","m_payeeAccount"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => {
      const map = { m_quantity:"quantity", m_buyPrice:"buyPrice", m_sellPrice:"sellPrice", m_commValue:"commValue", m_notes:"notes", m_payeeName:"payeeName", m_payeeBank:"payeeBank", m_payeeAccount:"payeeAccount" };
      matchState[map[id]] = el.value;
      // Re-render only the commission box without losing focus: cheap approach — re-render whole tab but restore focus after
      const focusId = document.activeElement ? document.activeElement.id : null;
      render();
      if (focusId) {
        const toFocus = document.getElementById(focusId);
        if (toFocus) { toFocus.focus(); if (toFocus.setSelectionRange) { const v=toFocus.value; toFocus.setSelectionRange(v.length, v.length);} }
      }
    };
  });
  const m_commType = document.getElementById("m_commType");
  if (m_commType) m_commType.onchange = () => { matchState.commType = m_commType.value; render(); };
  const logDealBtn = document.getElementById("logDealBtn");
  if (logDealBtn) logDealBtn.onclick = () => {
    const supplyMatch = data.supply.find(s => s.id === matchState.supplyId);
    const demandMatch = data.demand.find(d => d.id === matchState.demandId);
    if (!supplyMatch || !demandMatch) return;
    const margin = (Number(matchState.sellPrice||0) - Number(matchState.buyPrice||0)) * Number(matchState.quantity||0);
    const commissionEarned = Math.max(0, matchState.commType === "percent" ? margin * (Number(matchState.commValue||0)/100) : Number(matchState.commValue||0));
    data.transactions.push({
      id: uid(), date: new Date().toISOString(),
      farmer: supplyMatch.farmer, buyer: demandMatch.buyer, produce: supplyMatch.produce,
      quantity: Number(matchState.quantity), unit: supplyMatch.unit,
      buyPricePerUnit: Number(matchState.buyPrice), sellPricePerUnit: Number(matchState.sellPrice),
      commissionType: matchState.commType, commissionValue: Number(matchState.commValue),
      commissionEarned, notes: matchState.notes, supplyId: supplyMatch.id, demandId: demandMatch.id,
      payeeName: matchState.payeeName, payeeBank: matchState.payeeBank, payeeAccount: matchState.payeeAccount,
      paymentStatus: "unpaid"
    });
    supplyMatch.status = "closed"; demandMatch.status = "closed";
    logActivity("Logged deal", `${supplyMatch.produce} — ${supplyMatch.farmer} \u2192 ${demandMatch.buyer}, ${matchState.quantity} ${supplyMatch.unit}, commission ${naira(commissionEarned)}`);
    matchState = { supplyId:"", demandId:"", quantity:"", buyPrice:"", sellPrice:"", commType:"percent", commValue:"10", notes:"", payeeName:"", payeeBank:"", payeeAccount:"" };
    persist(); render();
  };

  // Payments tab
  document.querySelectorAll("[data-toggle-paid]").forEach(btn => {
    btn.onclick = () => {
      const t = data.transactions.find(x => x.id === btn.dataset.togglePaid);
      if (t) {
        t.paymentStatus = t.paymentStatus === "paid" ? "unpaid" : "paid";
        logActivity(t.paymentStatus === "paid" ? "Marked commission paid" : "Marked commission unpaid", `${t.payeeName || "Unnamed payee"} — ${naira(t.commissionEarned)}`);
      }
      persist(); render();
    };
  });

  // Impact report — print
  const printBtn = document.getElementById("printReportBtn");
  if (printBtn) printBtn.onclick = () => window.print();

  // Export tab
  const FARMER_CSV_COLUMNS = [
    {label:"Farmer", value:"farmer"}, {label:"Phone", value:"phone"}, {label:"Produce", value:"produce"},
    {label:"Quantity", value:"quantity"}, {label:"Unit", value:"unit"}, {label:"Price per unit", value:"pricePerUnit"},
    {label:"Hectares owned", value:"hectares"},
    {label:"State", value:"state"}, {label:"LGA", value:"lga"}, {label:"Community", value:"community"},
    {label:"Location", value:"location"}, {label:"Status", value:"status"},
    {label:"Date", value:(r)=>new Date(r.date).toLocaleDateString()},
  ];
  const exportSupplyBtn = document.getElementById("exportSupplyBtn");
  if (exportSupplyBtn) exportSupplyBtn.onclick = () => {
    const csv = toCSV(data.supply, FARMER_CSV_COLUMNS);
    downloadFile("lausorgo_farmers.csv", csv, "text/csv");
  };
  const exportFarmersOnlyBtn = document.getElementById("exportFarmersOnlyBtn");
  if (exportFarmersOnlyBtn) exportFarmersOnlyBtn.onclick = () => {
    if (!unlockedTabs.has("export")) {
      const val = window.prompt("This download is PIN-protected. Enter PIN:");
      if (val === null) return; // cancelled
      if (val !== RESTRICTED_PIN) { alert("Incorrect PIN."); return; }
      unlockedTabs.add("export");
      logActivity("Unlocked restricted tab", "Export Data (via farmer download)");
    }
    const csv = toCSV(data.supply, FARMER_CSV_COLUMNS);
    downloadFile("lausorgo_farmers.csv", csv, "text/csv");
    logActivity("Exported farmer data", `${data.supply.length} farmer record(s) downloaded`);
  };
  const exportDemandBtn = document.getElementById("exportDemandBtn");
  if (exportDemandBtn) exportDemandBtn.onclick = () => {
    const csv = toCSV(data.demand, [
      {label:"Buyer", value:"buyer"}, {label:"Phone", value:"phone"}, {label:"Produce", value:"produce"},
      {label:"Quantity", value:"quantity"}, {label:"Unit", value:"unit"}, {label:"Price offered", value:"priceOfferedPerUnit"},
      {label:"Owns a shop", value:"ownsShop"},
      {label:"State", value:"state"}, {label:"LGA", value:"lga"}, {label:"Community", value:"community"},
      {label:"Location", value:"location"}, {label:"Status", value:"status"},
      {label:"Date", value:(r)=>new Date(r.date).toLocaleDateString()},
    ]);
    downloadFile("lausorgo_buyers.csv", csv, "text/csv");
  };
  const exportDealsBtn = document.getElementById("exportDealsBtn");
  if (exportDealsBtn) exportDealsBtn.onclick = () => {
    const csv = toCSV(data.transactions, [
      {label:"Date", value:(r)=>new Date(r.date).toLocaleDateString()},
      {label:"Produce", value:"produce"}, {label:"Farmer", value:"farmer"}, {label:"Buyer", value:"buyer"},
      {label:"Quantity", value:"quantity"}, {label:"Unit", value:"unit"},
      {label:"Buy price/unit", value:"buyPricePerUnit"}, {label:"Sell price/unit", value:"sellPricePerUnit"},
      {label:"Margin", value:(r)=>(r.sellPricePerUnit-r.buyPricePerUnit)*r.quantity},
      {label:"Commission earned", value:"commissionEarned"},
      {label:"Payee", value:"payeeName"}, {label:"Payee bank", value:"payeeBank"}, {label:"Payee account", value:"payeeAccount"},
      {label:"Payment status", value:"paymentStatus"}, {label:"Notes", value:"notes"},
    ]);
    downloadFile("lausorgo_deals.csv", csv, "text/csv");
  };
  const exportActivityBtn = document.getElementById("exportActivityBtn");
  if (exportActivityBtn) exportActivityBtn.onclick = () => {
    const csv = toCSV(data.activityLog || [], [
      {label:"When", value:(r)=>new Date(r.time).toLocaleString()},
      {label:"Who", value:"actor"}, {label:"Action", value:"action"}, {label:"Details", value:"details"},
    ]);
    downloadFile("lausorgo_activity_log.csv", csv, "text/csv");
  };
  const exportAllBtn = document.getElementById("exportAllBtn");
  if (exportAllBtn) exportAllBtn.onclick = () => {
    downloadFile("lausorgo_full_backup.json", JSON.stringify(data, null, 2), "application/json");
  };

  // PIN gate
  const pinSubmit = document.getElementById("pinSubmit");
  if (pinSubmit) pinSubmit.onclick = () => {
    const val = document.getElementById("pinInput").value;
    const tabId = pinSubmit.dataset.pinTab;
    if (val === RESTRICTED_PIN) {
      unlockedTabs.add(tabId);
      logActivity("Unlocked restricted tab", tabId === "report" ? "Impact Report" : "Export Data");
      render();
    } else {
      document.getElementById("pinError").textContent = "Incorrect PIN — try again.";
      document.getElementById("pinInput").value = "";
      document.getElementById("pinInput").focus();
    }
  };
}

loadData();
</script>
</body>
</html>
